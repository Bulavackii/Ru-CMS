<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600" role="img" aria-label="RU CMS — модульная CMS на Laravel">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="0.55" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="600" fill="url(#g1)"/>

  <g fill="#ffffff" opacity="0.08">
    <circle cx="1320" cy="120" r="240"/>
    <circle cx="1480" cy="470" r="150"/>
    <rect x="90" y="430" width="360" height="8"/>
  </g>

  <g fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="2">
    <rect x="1130" y="180" width="150" height="150" transform="rotate(14 1205 255)"/>
    <rect x="1215" y="255" width="150" height="150" transform="rotate(14 1290 330)"/>
  </g>

  <text x="100" y="250" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="76" font-weight="700" fill="#ffffff">RU CMS</text>
  <text x="100" y="330" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="40" font-weight="500" fill="#e0e7ff">Модульная система управления сайтом</text>
  <text x="100" y="392" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="26" fill="#c7d2fe">Новости, страницы, меню, категории и SEO — из коробки</text>

  <!-- Кнопка ведёт туда же, куда сам слайд, — на страницу «О проекте»
       (см. link в SeedDefaultSlideshowsCommand). Раньше здесь было
       «Открыть админку»: баннер на главной видит любой посетитель, и
       звать его в панель управления незачем. -->
  <g transform="translate(100, 452)">
    <rect width="278" height="56" fill="#ffffff"/>
    <text x="139" y="36" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="22" font-weight="600" fill="#4f46e5">Подробнее о проекте</text>
  </g>
</svg>
