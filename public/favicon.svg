<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="RU CMS">
  <title>RU CMS</title>

  <!--
    Иконка проекта: три слоя — тот же символ модульности, что у мастера
    установки (fa-layer-group) и в шапке админки. Палитра — акцент
    проекта: indigo #6366f1 → #8b5cf6.

    Мелких деталей намеренно нет: на 16×16 во вкладке браузера различимы
    только крупные формы, поэтому слои сделаны толстыми и контрастными.
  -->

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Верхний слой -->
  <path d="M32 13 L51 23 L32 33 L13 23 Z" fill="#ffffff"/>

  <!-- Средний слой -->
  <path d="M32 38.5 L46.5 31 L51 33.5 L32 43.5 L13 33.5 L17.5 31 Z"
        fill="#ffffff" opacity="0.75"/>

  <!-- Нижний слой -->
  <path d="M32 48.5 L46.5 41 L51 43.5 L32 53.5 L13 43.5 L17.5 41 Z"
        fill="#ffffff" opacity="0.5"/>
</svg>
