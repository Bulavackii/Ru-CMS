<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Online">
  <!--
    Знак «онлайн-оплата». Рисуем сами: это не чужой товарный знак, а
    обозначение категории, поэтому его можно и нужно нарисовать в одном
    весе с логотипами платёжных систем — иначе плитка рядом с ними
    выглядит пустой.

    Смысл: карта и сеть. Карта — чем платят, дуги — что платёж уходит
    через интернет.
  -->
  <defs>
    <linearGradient id="on-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>

  <!-- карта -->
  <rect x="6" y="16" width="42" height="28" rx="4" fill="url(#on-g)"/>
  <rect x="6" y="23" width="42" height="5" fill="#312E81" opacity=".55"/>
  <rect x="11" y="34" width="13" height="4" rx="2" fill="#fff" opacity=".9"/>

  <!-- сеть: дуги сигнала от правого верхнего угла -->
  <g fill="none" stroke="#4F46E5" stroke-width="4" stroke-linecap="round">
    <path d="M44 14a14 14 0 0 1 12 12"/>
    <path d="M45 6a22 22 0 0 1 19 19" opacity=".55"/>
  </g>
</svg>
