<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Offline">
  <!--
    Знак «оплата вне сайта»: купюра и монета. Рисуем сами — это
    обозначение категории, а не чужой товарный знак, и рядом с
    настоящими логотипами плитка не должна выглядеть пустой.
  -->
  <defs>
    <linearGradient id="off-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#94A3B8"/>
      <stop offset="1" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <!-- купюра -->
  <rect x="4" y="18" width="46" height="26" rx="4" fill="url(#off-g)"/>
  <circle cx="27" cy="31" r="7" fill="#F8FAFC" opacity=".92"/>
  <rect x="9" y="23" width="6" height="3" rx="1.5" fill="#F8FAFC" opacity=".7"/>
  <rect x="39" y="36" width="6" height="3" rx="1.5" fill="#F8FAFC" opacity=".7"/>

  <!-- монета поверх правого нижнего угла -->
  <circle cx="47" cy="44" r="12" fill="#CBD5E1"/>
  <circle cx="47" cy="44" r="8.5" fill="#F1F5F9"/>
  <path d="M47 39v10M44 41.5h6M44 46.5h6" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
</svg>
