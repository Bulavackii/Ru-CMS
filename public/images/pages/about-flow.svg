<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 120" role="img" aria-label="Путь материала: черновик, проверка, публикация, обновление">
  <defs>
    <linearGradient id="af-g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="640" height="120" fill="#ffffff"/>

  <path d="M80 60 H560" stroke="#e0e7ff" stroke-width="5" fill="none"/>
  <path d="M80 60 H400" stroke="url(#af-g)" stroke-width="5" fill="none"/>

  <!-- черновик -->
  <circle cx="80" cy="60" r="24" fill="url(#af-g)"/>
  <rect x="70" y="52" width="20" height="4" fill="#fff"/>
  <rect x="70" y="62" width="13" height="4" fill="#fff" opacity=".75"/>

  <!-- проверка -->
  <circle cx="240" cy="60" r="24" fill="url(#af-g)"/>
  <path d="M230 60 l7 7 l13 -15" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- публикация -->
  <circle cx="400" cy="60" r="24" fill="url(#af-g)"/>
  <path d="M390 68 l10 -16 l10 16 z" fill="#fff"/>

  <!-- обновление -->
  <circle cx="560" cy="60" r="24" fill="#ffffff" stroke="#c7d2fe" stroke-width="3"/>
  <path d="M552 60 a8 8 0 1 1 3 6" stroke="#a5b4fc" stroke-width="3.5" fill="none" stroke-linecap="round"/>
</svg>
